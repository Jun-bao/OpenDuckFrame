name: SPThroughputProbe
packages:
  RifeMetal:
    url: https://github.com/cinemore/rife-metal.git
    exactVersion: 0.1.8
options:
  deploymentTarget:
    macOS: "14.0"
configs:
  Release: release
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_ENABLE_OBJC_ARC: YES
    CODE_SIGNING_ALLOWED: NO
    DEAD_CODE_STRIPPING: NO
    HEADER_SEARCH_PATHS:
      - $(inherited)
      - $(SRCROOT)/..
      - $(SRCROOT)/../../MediaCore/Bridge
      - $(SRCROOT)/../../MediaCore/Core
      - $(SRCROOT)/../../../Apps/Mac/Capture
    SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/SPThroughput-Bridging-Header.h
    SWIFT_OPTIMIZATION_LEVEL: -O
    GCC_OPTIMIZATION_LEVEL: 3
targets:
  SPThroughputProbe:
    type: tool
    platform: macOS
    sources:
      - SPThroughputProbe.mm
      - ../SPFRCEngine.mm
      - ../SPFrameBudgetMetal.mm
      - ../../../Apps/Mac/Capture/SPLowLatencyEngine.mm
      - ../../../Apps/Mac/Capture/SPRifeEngine.swift
      - ../../../Apps/Mac/Capture/SPRifeContinuity.swift
    dependencies:
      - package: RifeMetal
        product: RifeMetal
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Foundation.framework
      - sdk: Metal.framework
      - sdk: VideoToolbox.framework
      - sdk: IOSurface.framework
      - sdk: CoreGraphics.framework
      - sdk: ImageIO.framework
