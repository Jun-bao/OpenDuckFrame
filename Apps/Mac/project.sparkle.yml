# Optional direct-distribution update support. Apps/Mac/Scripts/build.sh enables this
# include for local Debug/Release builds. App Store scripts disable the include,
# so Store archives contain neither Sparkle nor its Info.plist configuration.
targets:
  OpenDuckFrame:
    settings:
      base:
        # Persist the generation decision in the project. The base project's
        # distribution guard rejects AppStore builds when this marker is set.
        ODF_SPARKLE_EMBEDDED: YES
    dependencies:
      - framework: ../../ThirdParty/sparkle-min/Sparkle.framework
        embed: true
        link: false
        codeSign: false
