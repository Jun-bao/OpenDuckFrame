name: Bug report
description: Report a reproducible playback or enhancement problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Review screenshots and logs for private content. Use the Security tab for vulnerabilities.
  - type: input
    id: app-version
    attributes:
      label: OpenDuckFrame version
      placeholder: 0.1.0 (1), or source commit
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Mac model and macOS version
      placeholder: Mac model, chip, macOS version, display refresh rate
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Source and enhancement settings
      description: Source application or file format, window/display/file input, resolution, engine, quality, scaling, requested rate and actual output.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include expected and observed behavior. Attach only media you are allowed to share.
    validations:
      required: true
