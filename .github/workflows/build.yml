name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build:
        description: Build application artifacts
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out source and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install check tools
        run: |
          python3 -m pip install -r Design/AppIcon/requirements.txt
          brew install gitleaks
      - name: Check public repository
        run: ./Scripts/check_public_repo.sh
      - name: Scan repository history for secrets
        run: gitleaks git . --log-opts='--all' --redact --no-banner

  release-build:
    if: github.event_name == 'workflow_dispatch' && inputs.build
    needs: repository
    runs-on: macos-26
    timeout-minutes: 75

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Show Apple toolchain
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Install build tools
        run: brew install xcodegen meson ninja cmake pkg-config

      - name: Cache verified dependency builds
        uses: actions/cache@v4
        with:
          path: |
            ThirdParty/downloads
            ThirdParty/dav1d-min
            ThirdParty/speex-min
            ThirdParty/ffmpeg-min
            ThirdParty/subtitles-min
            ThirdParty/sparkle-min
          key: odf-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ThirdParty/deps.lock.json', 'Scripts/build_*.sh', 'Scripts/lib/**', 'Scripts/patches/**') }}

      - name: Check public repository boundary
        run: ./Scripts/check_public_repo.sh

      - name: Build and verify Release app
        run: ./Apps/Mac/Scripts/build.sh Release

      - name: Compile and inspect unsigned App Store archive
        run: ./Scripts/smoke_app_store_unsigned.sh
